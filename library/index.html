<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Library</h1>
      <button id="add-new-book" command="show-modal" commandfor="book-dialog">
        New Book
      </button>
    </header>

    <dialog id="book-dialog">
      <form action="" method="get" class="book-form">
        <div class="form-row">
          <label for="bookTitle">Title</label>
          <input id="bookTitle" name="bookTitle" type="text" required />
        </div>
        <div class="form-row">
          <label for="bookAuthor">Author</label>
          <input id="bookAuthor" name="bookAuthor" type="text" required />
        </div>
        <div class="form-row">
          <label for="bookPages">Pages</label>
          <input
            id="bookPages"
            name="bookPages"
            type="number"
            required
            min="1"
          />
        </div>
        <div class="form-row">
          <label for="bookRead">Read</label>
          <input id="bookRead" name="bookRead" type="checkbox" />
        </div>
        <button type="submit">Add book</button>
      </form>
      <button commandfor="book-dialog" command="close">Close</button>
    </dialog>

    <div class="library"></div>
  </body>
</html>
